openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: storage
    description: Persistent media uploads
  - name: submissions
    description: Contest entries and admin review
  - name: admin
    description: Admin access and dashboard
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a direct upload URL
      description: Creates a single-use resumable storage session. PUT exactly the declared bytes to uploadURL. MP4/MOV videos are limited to 524288000 bytes (500 MiB); PNG signatures to 2097152 bytes (2 MiB). Stored media is independently checked before entry acceptance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRequest"
      responses:
        "200":
          description: Upload URL created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          description: Invalid upload metadata
  /storage/objects/{objectPath}:
    get:
      operationId: getStoredObject
      tags: [storage]
      summary: Serve a stored media object
      description: The optional preview=1 query returns a generated JPEG video thumbnail under the same authorization checks as the source object.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stored object
          content:
            application/octet-stream: {}
        "404":
          description: Object not found
  /submissions:
    get:
      operationId: listSubmissions
      tags: [submissions]
      summary: List contest submissions for the admin
      parameters:
        - name: search
          in: query
          schema:
            type: string
            maxLength: 200
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          description: Exclusive entry ID boundary, newest IDs first.
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SubmissionStatus"
      responses:
        "200":
          description: Bounded review queue summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewQueuePage"
        "400":
          description: Invalid search or pagination
        "401":
          description: Admin authentication required
    post:
      operationId: createSubmission
      tags: [submissions]
      summary: Create a new contest submission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionInput"
      responses:
        "201":
          description: Submission created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
        "400":
          description: Invalid submission
        "403":
          description: First contest closed (code CONTEST_CLOSED). Entries must reach the server before January 1, 2027 at 00:00 America/Phoenix (07:00 UTC).
  /submissions/{id}:
    get:
      operationId: getSubmission
      tags: [submissions]
      summary: Get a submission for the admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Submission detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
        "401":
          description: Admin authentication required
        "404":
          description: Submission not found
    patch:
      operationId: updateSubmission
      tags: [submissions]
      summary: Update submission review status or punchline
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionUpdate"
      responses:
        "200":
          description: Submission updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
        "401":
          description: Admin authentication required
        "404":
          description: Submission not found
  /submissions/{id}/analyze:
    post:
      operationId: analyzeSubmission
      tags: [submissions]
      summary: Analyze a submission video and suggest action trim points and punchlines
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Submission with AI review suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
        "401":
          description: Admin authentication required
        "404":
          description: Submission not found
        "409":
          description: Another active or replacement analysis run owns this submission
        "500":
          description: Video analysis failed
  /showcase:
    get:
      operationId: listShowcaseEntries
      tags: [submissions]
      summary: List approved entries for the public showcase
      responses:
        "200":
          description: Approved contest entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShowcaseEntry"
  /showcase/{id}/like:
    post:
      operationId: toggleShowcaseLike
      tags: [engagement]
      summary: Toggle an anonymous browser like on an approved video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShowcaseLikeInput"
      responses:
        "200":
          description: Updated like state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowcaseLike"
        "404":
          description: Approved video not found
  /subscribers:
    post:
      operationId: createSubscriber
      tags: [engagement]
      summary: Request an email subscription confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriberInput"
      responses:
        "202":
          description: Confirmation email requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriberStatus"
  /subscribers/resend:
    post:
      operationId: resendSubscriberConfirmation
      tags: [engagement]
      summary: Request a replacement subscription confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriberConfirmationResendInput"
      responses:
        "202":
          description: Replacement request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriberStatus"
  /subscribers/verify:
    get:
      operationId: verifySubscriber
      tags: [engagement]
      summary: Confirm an email subscription
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Subscription confirmed
          content:
            text/html:
              schema:
                type: string
  /subscribers/unsubscribe:
    get:
      operationId: unsubscribeSubscriber
      tags: [engagement]
      summary: Unsubscribe an email address
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Subscription removed
          content:
            text/html:
              schema:
                type: string
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [admin]
      summary: Get submission counts for the admin dashboard
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Admin authentication required
  /admin/contestants:
    get:
      operationId: getAdminContestants
      tags: [admin]
      summary: Search submission contacts for administrators
      parameters:
        - name: search
          in: query
          description: Case-insensitive substring of owner name, dog name or email
          schema:
            type: string
            maxLength: 100
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          description: Return submissions with IDs less than this ID
          schema:
            type: string
            pattern: "^[1-9][0-9]*$"
      responses:
        "200":
          description: Bounded contacts page, one row per submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminContestantsPage"
        "400":
          description: Invalid search or pagination parameters
        "401":
          description: Admin authentication required
  /admin/welcome-emails:
    get:
      operationId: getWelcomeEmailAdminRecords
      tags: [admin]
      summary: Show welcome email delivery states for administrators
      parameters:
        - name: limit
          in: query
          description: Maximum number of operational welcome email records to return
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          description: Return records after this page cursor
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Welcome email delivery states
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WelcomeEmailAdminRecordsPage"
        "400":
          description: Invalid pagination parameters
        "401":
          description: Admin authentication required
  /admin/deferred-confirmations:
    get:
      operationId: getDeferredConfirmationAdminStatus
      tags: [admin]
      summary: Show aggregate deferred confirmation retry status for administrators
      responses:
        "200":
          description: Aggregate status of pending confirmation attempts in an active retry window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeferredConfirmationAdminStatus"
        "401":
          description: Admin authentication required
  /admin/newsletter-funnel:
    get:
      operationId: getNewsletterFunnelReport
      tags: [admin]
      summary: Read the aggregate newsletter confirmation funnel for administrators
      responses:
        "200":
          description: Aggregate newsletter funnel report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterFunnelReport"
        "401":
          description: Admin authentication required
        "503":
          description: Analytics provider unavailable
  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Start an admin session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Admin session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Invalid password
  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: End an admin session
      responses:
        "200":
          description: Admin session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
  /admin/session:
    get:
      operationId: getAdminSession
      tags: [admin]
      summary: Check the current admin session
      responses:
        "200":
          description: Current admin session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    UploadRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
          maximum: 524288000
        contentType:
          type: string
          enum: [video/mp4, video/quicktime, image/png]
      required: [name, size, contentType]
    UploadResponse:
      type: object
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
      required: [uploadURL, objectPath]
    SubmissionStatus:
      type: string
      enum: [pending, approved, needs_edit, rejected]
    SubmissionInput:
      type: object
      properties:
        ownerName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: ["string", "null"]
        dogName:
          type: string
          minLength: 1
        breedBio:
          type: ["string", "null"]
        trickName:
          type: ["string", "null"]
        trickDescription:
          type: string
          minLength: 1
        videoObjectPath:
          type: string
          minLength: 1
        videoFileName:
          type: string
          minLength: 1
        videoContentType:
          type: string
          minLength: 1
        signatureObjectPath:
          type: string
          minLength: 1
        driveReleaseFileId:
          type: ["string", "null"]
        driveReleaseUrl:
          type: ["string", "null"]
          format: uri
        airtableContestantId:
          type: ["string", "null"]
        airtableSubmissionId:
          type: ["string", "null"]
        processingStatus:
          type: string
        processedVideoObjectPath:
          type: ["string", "null"]
        voiceoverObjectPath:
          type: ["string", "null"]
        processingError:
          type: ["string", "null"]
      required:
        - ownerName
        - email
        - dogName
        - trickDescription
        - videoObjectPath
        - videoFileName
        - videoContentType
        - signatureObjectPath
    AdminContestant:
      type: object
      required: [id, ownerName, dogName, email, phone, submittedAt, status]
      properties:
        id: { type: integer }
        ownerName: { type: string }
        dogName: { type: string }
        email: { type: string }
        phone: { type: string }
        submittedAt: { type: string, format: date-time }
        status:
          type: string
          enum: [pending, approved, needs_edit, rejected]
    AdminContestantsPage:
      type: object
      required: [records, nextCursor]
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/AdminContestant"
        nextCursor:
          type: ["string", "null"]
    ReviewQueueEntry:
      type: object
      required: [id, dogName, ownerName, trickName, status]
      properties:
        id:
          type: integer
        dogName:
          type: string
        ownerName:
          type: string
        trickName:
          type: string
        status:
          $ref: "#/components/schemas/SubmissionStatus"
    ReviewQueuePage:
      type: object
      required: [records, nextCursor]
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/ReviewQueueEntry"
        nextCursor:
          type: [integer, "null"]
    Submission:
      type: object
      properties:
        id:
          type: integer
        ownerName:
          type: string
        email:
          type: string
        phone:
          type: string
        dogName:
          type: string
        breedBio:
          type: ["string", "null"]
        trickName:
          type: string
        trickDescription:
          type: string
        videoObjectPath:
          type: string
        videoFileName:
          type: string
        videoContentType:
          type: string
        signatureObjectPath:
          type: string
        driveReleaseFileId:
          type: ["string", "null"]
        driveReleaseUrl:
          type: ["string", "null"]
          format: uri
        airtableContestantId:
          type: ["string", "null"]
        airtableSubmissionId:
          type: ["string", "null"]
        processingStatus:
          type: string
        trimStartSeconds:
          type: ["number", "null"]
        trimEndSeconds:
          type: ["number", "null"]
        aiAnalysisStatus:
          type: string
        aiAnalysisRunId:
          type: ["string", "null"]
        aiAnalysisStartedAt:
          type: ["string", "null"]
          format: date-time
        aiAnalysisHeartbeatAt:
          type: ["string", "null"]
          format: date-time
        aiAnalysisChunksCompleted:
          type: ["integer", "null"]
        aiAnalysisChunksTotal:
          type: ["integer", "null"]
        aiTrimStartSeconds:
          type: ["number", "null"]
        aiTrimEndSeconds:
          type: ["number", "null"]
        aiDetectedAction:
          type: ["string", "null"]
        aiPunchlines:
          type: ["string", "null"]
        aiConfidence:
          type: ["number", "null"]
        aiAnalysisError:
          type: ["string", "null"]
        processedVideoObjectPath:
          type: ["string", "null"]
        voiceoverObjectPath:
          type: ["string", "null"]
        processingError:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/SubmissionStatus"
        punchline:
          type: ["string", "null"]
        submittedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - ownerName
        - email
        - phone
        - dogName
        - trickName
        - trickDescription
        - videoObjectPath
        - videoFileName
        - videoContentType
        - signatureObjectPath
        - processingStatus
        - aiAnalysisStatus
        - status
        - submittedAt
        - updatedAt
    SubmissionUpdate:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/SubmissionStatus"
        punchline:
          type: ["string", "null"]
        trimStartSeconds:
          type: ["number", "null"]
          minimum: 0
        trimEndSeconds:
          type: ["number", "null"]
          minimum: 0
    ShowcaseEntry:
      type: object
      properties:
        id:
          type: integer
        dogName:
          type: string
        breedBio:
          type: ["string", "null"]
        trickName:
          type: string
        trickDescription:
          type: string
        videoObjectPath:
          type: string
        processedVideoObjectPath:
          type: ["string", "null"]
        voiceoverObjectPath:
          type: ["string", "null"]
        punchline:
          type: ["string", "null"]
        publishedAt:
          type: string
          format: date-time
          description: First showcase publication time, preserved through edits and reprocessing. The epoch (1970-01-01T00:00:00Z) denotes an unknown historical publication date; ties sort by descending submission ID.
        likeCount:
          type: integer
      required:
        - id
        - dogName
        - trickName
        - trickDescription
        - videoObjectPath
        - publishedAt
        - likeCount
    ShowcaseLikeInput:
      type: object
      properties:
        browserId:
          type: string
          minLength: 16
          maxLength: 128
      required: [browserId]
    ShowcaseLike:
      type: object
      properties:
        submissionId:
          type: integer
        liked:
          type: boolean
        likeCount:
          type: integer
      required: [submissionId, liked, likeCount]
    SubscriberInput:
      type: object
      properties:
        email:
          type: string
          format: email
        consent:
          type: boolean
      required: [email, consent]
    SubscriberConfirmationResendInput:
      type: object
      properties:
        email:
          type: string
          format: email
      required: [email]
    SubscriberStatus:
      type: object
      properties:
        message:
          type: string
        cohort:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
      required: [message, cohort]
    DashboardSummary:
      type: object
      properties:
        total:
          type: integer
        pending:
          type: integer
        approved:
          type: integer
        needsEdit:
          type: integer
        rejected:
          type: integer
      required: [total, pending, approved, needsEdit, rejected]
    WelcomeEmailAdminStatus:
      type: string
      enum: [active_claim, expired_claim, failed, permanently_failed]
    WelcomeEmailAdminRecord:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        status:
          $ref: "#/components/schemas/WelcomeEmailAdminStatus"
        claimedAt:
          type: ["string", "null"]
          format: date-time
        failedAt:
          type: ["string", "null"]
          format: date-time
        lastError:
          type: ["string", "null"]
        attemptCount:
          type: integer
      required: [id, email, status, claimedAt, failedAt, lastError, attemptCount]
    WelcomeEmailRecoveryState:
      type: string
      enum: [clear, healthy, attention]
    WelcomeEmailAdminBacklog:
      type: object
      properties:
        retryableCount:
          type: integer
        oldestRetryAt:
          type: ["string", "null"]
          format: date-time
        oldestRetryAgeMinutes:
          type: ["integer", "null"]
        repeatedFailureCount:
          type: integer
        state:
          $ref: "#/components/schemas/WelcomeEmailRecoveryState"
      required:
        [retryableCount, oldestRetryAt, oldestRetryAgeMinutes, repeatedFailureCount, state]
    WelcomeEmailAdminRecordsPage:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/WelcomeEmailAdminRecord"
        nextCursor:
          type: ["string", "null"]
        backlog:
          $ref: "#/components/schemas/WelcomeEmailAdminBacklog"
      required: [records, nextCursor, backlog]
    DeferredConfirmationAdminStatus:
      type: object
      properties:
        deferredCount:
          type: integer
          description: Number of pending confirmation attempts currently inside their persisted retry window
        nextRetryAt:
          type: ["string", "null"]
          format: date-time
          description: Earliest persisted retry time among currently deferred confirmation attempts
      required: [deferredCount, nextRetryAt]
    NewsletterFunnelSource:
      type: string
      enum: [initial, replacement]
    NewsletterFunnelRow:
      type: object
      properties:
        source:
          $ref: "#/components/schemas/NewsletterFunnelSource"
        requests:
          type: integer
        confirmations:
          type: integer
        conversionRatePercent:
          type: ["number", "null"]
        ci95LowerPercent:
          type: ["number", "null"]
        ci95UpperPercent:
          type: ["number", "null"]
      required: [source, requests, confirmations, conversionRatePercent, ci95LowerPercent, ci95UpperPercent]
    NewsletterFunnelComparison:
      type: object
      properties:
        result:
          type: string
        liftPoints:
          type: ["number", "null"]
        liftCi95LowerPoints:
          type: ["number", "null"]
        liftCi95UpperPoints:
          type: ["number", "null"]
      required: [result, liftPoints, liftCi95LowerPoints, liftCi95UpperPoints]
    NewsletterFunnelCoverageCohort:
      type: object
      properties:
        cohort:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        coverageStatus:
          type: string
          enum: [coverage_unavailable, missing_coverage, zero_requests, covered]
        requests:
          type: integer
      required: [cohort, coverageStatus, requests]
    NewsletterFunnelCoverage:
      type: object
      properties:
        startDate:
          type: ["string", "null"]
          pattern: '^\d{4}-\d{2}-\d{2}$'
        status:
          type: string
          enum: [recorded, unavailable]
        auditTrail:
          type: array
          items:
            type: object
            properties:
              coverageStartDate:
                type: ["string", "null"]
                pattern: '^\d{4}-\d{2}-\d{2}$'
              reason:
                type: string
                minLength: 1
            required: [coverageStartDate, reason]
        cohorts:
          type: array
          items:
            $ref: "#/components/schemas/NewsletterFunnelCoverageCohort"
        alerts:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum: [missing_events, coverage_regression]
              cohorts:
                type: array
                items:
                  type: string
                  pattern: '^\d{4}-\d{2}-\d{2}$'
            required: [kind, cohorts]
      required: [startDate, status, auditTrail, cohorts, alerts]
    NewsletterFunnelReport:
      type: object
      properties:
        reportAsOf:
          type: string
        coverage:
          $ref: "#/components/schemas/NewsletterFunnelCoverage"
        native:
          type: object
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/NewsletterFunnelRow"
            comparison:
              $ref: "#/components/schemas/NewsletterFunnelComparison"
          required: [rows, comparison]
        historical:
          type: object
          properties:
            rows:
              type: array
              items:
                $ref: "#/components/schemas/NewsletterFunnelRow"
          required: [rows]
      required: [reportAsOf, coverage, native, historical]
    AdminLoginInput:
      type: object
      properties:
        password:
          type: string
          minLength: 1
      required: [password]
    AdminSession:
      type: object
      properties:
        authenticated:
          type: boolean
      required: [authenticated]
