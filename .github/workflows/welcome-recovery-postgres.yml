name: Welcome recovery PostgreSQL compatibility

on:
  pull_request:
    paths:
      - ".github/workflows/welcome-recovery-postgres.yml"
      - ".npmrc"
      - "artifacts/api-server/package.json"
      - "artifacts/api-server/src/lib/**"
      - "artifacts/api-server/src/routes/admin.ts"
      - "artifacts/api-server/src/routes/engagement.ts"
      - "artifacts/api-server/src/routes/reviewQueue.ts"
      - "artifacts/api-server/src/routes/submissions.ts"
      - "artifacts/api-server/src/routes/subscriberNotifications.integration.test.ts"
      - "artifacts/api-server/test.mjs"
      - "artifacts/api-server/test-discovery.mjs"
      - "artifacts/api-server/tsconfig.json"
      - "lib/api-zod/**"
      - "lib/db/drizzle.config.ts"
      - "lib/db/package.json"
      - "lib/db/scripts/normalize-subscriber-emails.mjs"
      - "lib/db/src/**"
      - "lib/integrations-gemini-ai/**"
      - "lib/integrations-openai-ai-server/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/welcome-recovery-postgres.yml"
      - ".npmrc"
      - "artifacts/api-server/package.json"
      - "artifacts/api-server/src/lib/**"
      - "artifacts/api-server/src/routes/admin.ts"
      - "artifacts/api-server/src/routes/engagement.ts"
      - "artifacts/api-server/src/routes/reviewQueue.ts"
      - "artifacts/api-server/src/routes/submissions.ts"
      - "artifacts/api-server/src/routes/subscriberNotifications.integration.test.ts"
      - "artifacts/api-server/test.mjs"
      - "artifacts/api-server/test-discovery.mjs"
      - "artifacts/api-server/tsconfig.json"
      - "lib/api-zod/**"
      - "lib/db/drizzle.config.ts"
      - "lib/db/package.json"
      - "lib/db/scripts/normalize-subscriber-emails.mjs"
      - "lib/db/src/**"
      - "lib/integrations-gemini-ai/**"
      - "lib/integrations-openai-ai-server/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  welcome-recovery:
    name: Welcome recovery fixture (PostgreSQL ${{ matrix.version }}, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Run each PostgreSQL fixture on every supported Node major.
        node: [22, 24]
        # Supported stable majors, checked 2026-10-11 against:
        # https://www.postgresql.org/support/versioning/
        # Keep 14 through its final release on 2026-11-12; 19 is still beta.
        # On stable releases/EOL, review project support and update this list.
        # Every listed major must run the schema setup and recovery fixture below.
        version: [14, 15, 16, 17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.version }}
        env:
          POSTGRES_DB: workspace_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d workspace_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/workspace_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Create the fresh test schema
        run: pnpm --filter @workspace/db exec drizzle-kit push --config drizzle.config.ts
      - name: Run subscriber notification integration tests
        run: pnpm --filter @workspace/api-server run test:subscriber-notifications
